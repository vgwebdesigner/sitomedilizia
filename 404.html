<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="format-detection" content="telephone=no"/>
  <title>Pagina non trovata – Sitom Edilizia Srl</title>
  <meta name="description" content="La pagina che cerchi non esiste o è stata spostata. Torna alla home di Sitom Edilizia."/>
  <meta name="robots" content="noindex,follow"/>
  <link rel="icon" type="image/png" href="assets/favicon.png"/>
  <link rel="apple-touch-icon" href="assets/icon-192.png"/>
  <link rel="manifest" href="site.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--green:#1a7a38;--green-light:#219a47;--green-dark:#125429;--black:#0f0f0f;--text:#2a2a2a;--gray:#6b6b6b;--line:#e4e4e0;--bg:#f4f2ec;--white:#ffffff}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :focus-visible{outline:2px solid var(--green-light);outline-offset:3px}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--black);overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
    .bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
    .bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,15,.7) 0%,rgba(15,15,15,.88) 100%)}
    .wrap{position:relative;z-index:2;text-align:center;padding:2rem 6vw;max-width:640px}
    .nav-logo{display:inline-flex;margin-bottom:2.5rem}
    .nav-logo img{height:56px;width:auto;background:#fff;padding:6px}
    .code{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(4rem,14vw,7rem);color:var(--green-light);line-height:1;margin-bottom:1rem}
    h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);color:#fff;margin-bottom:1rem;line-height:1.2}
    p{color:rgba(255,255,255,0.8);font-size:1rem;line-height:1.8;margin-bottom:2.5rem}
    .actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;font-size:0.85rem;font-weight:700;letter-spacing:0.06em;padding:14px 30px;transition:all 0.2s}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:#fff;color:var(--black);box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .btn-primary:hover{background:var(--bg)}
    .btn-ghost{border:1px solid rgba(255,255,255,0.35);color:#fff}
    .btn-ghost:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.6)}
    .links{margin-top:2.5rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
    .links a{color:rgba(255,255,255,0.55);text-decoration:none;font-size:0.82rem;transition:color .2s}
    .links a:hover{color:var(--green-light)}
  </style>
</head>
<body>
  <img class="bg-img" src="assets/lavoro-13.webp" alt=""/>
  <div class="bg-overlay"></div>
  <div class="wrap">
    <a class="nav-logo" href="index.html"><img src="assets/logo-sitom.webp" alt="Sitom Edilizia"/></a>
    <div class="code">404</div>
    <h1>Questa pagina non esiste.</h1>
    <p>Il link potrebbe essere sbagliato o la pagina è stata spostata. Ma il resto del sito è a un clic da qui.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">Torna alla Home</a>
      <a class="btn btn-ghost" href="contatti.html">Contattaci</a>
    </div>
    <div class="links">
      <a href="chi-siamo.html">Chi Siamo</a>
      <a href="servizi.html">Servizi</a>
      <a href="lavora.html">Lavora con Noi</a>
    </div>
  </div>
</body>
</html>
